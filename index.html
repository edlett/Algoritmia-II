  <script>
    /* Service worker: sólo bajo http(s) y NUNCA en localhost.
       Su handler usa ignoreSearch, así que en desarrollo se traga el ?v= y
       sirve versiones viejas de cualquier archivo que edites. Abriendo
       index.html con file:// la app ya funciona sin conexión igualmente. */
    const local = ['localhost', '127.0.0.1', ''].indexOf(location.hostname) >= 0;
    if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !local) {
